plugins {
    id 'com.android.library'
}

android {
    namespace 'com.android'
    compileSdk 37

    defaultConfig {
        minSdk 29
        targetSdk 37
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        aidl true
    }
}
